limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/m;
server { listen 80; server_name _; return 301 https://$host$request_uri; }
server {
  listen 443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/certs/localhost.crt;
  ssl_certificate_key /etc/nginx/certs/localhost.key;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  client_max_body_size 2m;
  location /api/ { limit_req zone=api_limit burst=10 nodelay; proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
  location /docs { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location /openapi.json { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location / { proxy_pass http://frontend:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
