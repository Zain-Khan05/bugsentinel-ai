limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/m;
server {
  listen 80;
  server_name _;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header X-Permitted-Cross-Domain-Policies none always;
  client_max_body_size 2m;
  location /api/ { limit_req zone=api_limit burst=10 nodelay; proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto http; }
  location /docs { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location /openapi.json { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location / { proxy_pass http://frontend:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
