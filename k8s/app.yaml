apiVersion: v1
kind: Secret
metadata: { name: bugsentinel-secrets }
type: Opaque
stringData:
  JWT_SECRET: replace-in-cluster-with-a-long-random-secret
  DATABASE_URL: sqlite:///./bugsentinel.db
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: bugsentinel-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: bugsentinel-api } }
  template:
    metadata: { labels: { app: bugsentinel-api } }
    spec:
      containers:
        - name: api
          image: YOUR_REGISTRY/bugsentinel-ai:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: bugsentinel-secrets } }]
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false }
---
apiVersion: v1
kind: Service
metadata: { name: bugsentinel-api }
spec:
  selector: { app: bugsentinel-api }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bugsentinel-ingress
  annotations: { nginx.ingress.kubernetes.io/ssl-redirect: 'true' }
spec:
  tls: [{ hosts: [bugsentinel.example.com], secretName: bugsentinel-tls }]
  rules:
    - host: bugsentinel.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: bugsentinel-api, port: { number: 80 } } }
