services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bugsentinel:${POSTGRES_PASSWORD:-bugsentinel_dev_only}@db:5432/bugsentinel
      FRONTEND_URL: http://localhost:8081
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bugsentinel
      POSTGRES_USER: bugsentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bugsentinel_dev_only}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugsentinel -d bugsentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
  nginx:
    image: nginx:1.27-alpine
    ports: ["8081:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
volumes:
  postgres_data:
